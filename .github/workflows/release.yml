name: Release VideoRenderer

# Fork addition, kept separate from upstream's main.yml so upstream merges
# don't conflict. Pushing a v* tag builds the renderer with build_mpcvr.cmd
# (x86 + x64, packed into _bin\MpcVideoRenderer-*.zip with the install
# scripts) and attaches the zip to a GitHub Release for that tag.
# Pull requests are already build-checked by main.yml.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      # A tag checkout is a detached HEAD, so update_revision.cmd would write
      # REV_BRANCH LOCAL into the version string and the zip name. Put the tag
      # on a branch: master when the tag is on master (build_mpcvr.cmd then
      # leaves the branch out of the name), otherwise release-<tag> (not the tag
      # name itself, which would make the branch name ambiguous).
      - name: Check out the tag on a branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -eq 0) { git checkout -B master } else { git checkout -B "release-${{ github.ref_name }}" }
        shell: pwsh

      - name: Build VideoRenderer
        run: |
          .\\build_mpcvr.cmd NoWait
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: "MPC Video Renderer"
          path: _bin/MpcVideoRenderer*.zip
          compression-level: 0

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: _bin/MpcVideoRenderer*.zip
          generate_release_notes: true
